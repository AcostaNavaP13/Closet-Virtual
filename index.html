<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Virtual Closet — Tu armario digital inteligente. Sube tu ropa, crea outfits y organiza tu estilo personal.">
  <meta name="theme-color" content="#7C3AED">
  <title>Virtual Closet — Tu Armario Digital Inteligente</title>

  <!-- ═══ Security Headers (CSP) ═══ -->
  <!-- Previene XSS, inyección de scripts externos no autorizados -->
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src  'self' 'unsafe-inline'
                  https://www.gstatic.com
                  https://cdnjs.cloudflare.com;
      style-src   'self' 'unsafe-inline'
                  https://fonts.googleapis.com
                  https://cdnjs.cloudflare.com;
      font-src    'self'
                  https://fonts.gstatic.com
                  https://cdnjs.cloudflare.com
                  data:;
      img-src     'self' data: blob: https:;
      connect-src 'self'
                  https://*.googleapis.com
                  https://*.firebaseio.com
                  https://*.firebaseapp.com
                  https://firestore.googleapis.com
                  https://identitytoolkit.googleapis.com
                  https://securetoken.googleapis.com;
      frame-src   'self' https://*.firebaseapp.com;
      frame-ancestors 'none';
      base-uri    'self';
      form-action 'self';
    ">

  <!-- Previene detección de MIME type (sniffing attack) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Previene que el navegador abra documentos peligrosos -->
  <meta http-equiv="X-Download-Options" content="noopen">
  <!-- Protección XSS adicional para navegadores legacy -->
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <!-- Previene clickjacking vía Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- ═══ Styles ═══ -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>
  <!-- ═══ Toast Notifications ═══ -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ═══ Feedback Button & Modal ═══ -->
  <button id="feedback-btn" onclick="document.getElementById('feedback-modal').classList.add('active')" style="position:fixed;bottom:80px;right:20px;z-index:9999;width:50px;height:50px;border-radius:50%;background:var(--color-primary);color:white;border:none;box-shadow:0 4px 15px rgba(124,58,237,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.3s;">
    <span class="material-symbols-outlined">rate_review</span>
  </button>
  
  <div id="feedback-modal" class="modal-backdrop">
    <div class="modal-content" style="background:var(--color-surface-1);border:1px solid var(--color-border-medium);">
      <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:1rem;color:var(--color-text-primary);">📝 Enviar Feedback</h2>
      <p style="color:var(--color-text-secondary);font-size:0.9rem;margin-bottom:1rem;">Ayúdanos a mejorar. Cuéntanos qué falló o qué te gustaría ver.</p>
      
      <form action="https://formsubmit.co/acostanavap13@gmail.com" method="POST" enctype="multipart/form-data">
        <!-- Configuraciones de FormSubmit -->
        <input type="hidden" name="_subject" value="Nuevo Feedback - Virtual Closet!">
        <input type="hidden" name="_captcha" value="false">
        <!-- Cambiar a tu URL real para regresar al inicio -->
        <input type="hidden" name="_next" value="https://acostanavap13.github.io/">

        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Tu Nombre</label>
          <input type="text" name="name" class="form-input" required placeholder="Ej: Carlos">
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Comentarios / Problema</label>
          <textarea name="message" class="form-input" rows="4" required placeholder="Explica el problema o tu sugerencia..."></textarea>
        </div>
        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label">Captura de Pantalla (Opcional)</label>
          <input type="file" name="attachment" accept="image/png, image/jpeg" class="form-input" style="padding:0.5rem;">
        </div>
        
        <div style="display:flex;gap:1rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;"><span class="material-symbols-outlined" style="margin-right:8px;vertical-align:middle;">send</span> Enviar</button>
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('feedback-modal').classList.remove('active')">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══ App Container ═══ -->
  <div id="app"></div>
  <div id="google_translate_element"></div>

  <!-- ═══ Modal Backdrop ═══ -->
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal" id="modal-content"></div>

  <!-- ═══ Firebase (Google) ═══ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <!-- ═══ App Scripts (security FIRST) ═══ -->
  <script src="js/security.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
