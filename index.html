<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Virtual Closet — Tu armario digital inteligente. Sube tu ropa, crea outfits y organiza tu estilo personal.">
  <meta name="theme-color" content="#7C3AED">
  <title>Virtual Closet — Tu Armario Digital Inteligente</title>

  <!-- ═══ Security Headers (CSP) ═══ -->
  <!-- Previene XSS, inyección de scripts externos no autorizados -->
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src  'self' 'unsafe-inline'
                  https://www.gstatic.com
                  https://cdnjs.cloudflare.com;
      style-src   'self' 'unsafe-inline'
                  https://fonts.googleapis.com
                  https://cdnjs.cloudflare.com;
      font-src    'self'
                  https://fonts.gstatic.com
                  https://cdnjs.cloudflare.com
                  data:;
      img-src     'self' data: blob: https:;
      connect-src 'self'
                  https://*.googleapis.com
                  https://*.firebaseio.com
                  https://firestore.googleapis.com
                  https://identitytoolkit.googleapis.com
                  https://securetoken.googleapis.com;
      frame-ancestors 'none';
      base-uri    'self';
      form-action 'self';
    ">

  <!-- Previene detección de MIME type (sniffing attack) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Previene que el navegador abra documentos peligrosos -->
  <meta http-equiv="X-Download-Options" content="noopen">
  <!-- Protección XSS adicional para navegadores legacy -->
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <!-- Previene clickjacking vía Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- ═══ Styles ═══ -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- ═══ Toast Notifications ═══ -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ═══ App Container ═══ -->
  <div id="app"></div>

  <!-- ═══ Modal Backdrop ═══ -->
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal" id="modal-content"></div>

  <!-- ═══ Firebase (Google) ═══ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <!-- ═══ App Scripts (security FIRST) ═══ -->
  <script src="js/security.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
